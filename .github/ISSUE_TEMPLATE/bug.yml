name: Bug report / 缺陷报告
description: Describe a reproducible failure. / 描述可复现的问题。
body:
  - type: textarea
    id: location
    attributes:
      label: App, release and environment / 应用、版本与环境
      description: Include the app or page, browser and platform version. Name the owning repository if known. / 填写应用或页面、浏览器和平台版本，已知时注明所属仓库。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 复现步骤
      description: Use synthetic examples and remove private details. / 请使用合成样例并移除私人信息。
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Expected and observed behavior / 预期与实际表现
      description: State the observable condition that would confirm the fix. / 写出可以确认缺陷已修复的可观察条件。
    validations:
      required: true
  - type: textarea
    id: related
    attributes:
      label: Related work / 相关工作
      description: Optional links to platform or app issues/PRs. / 可选，关联平台或应用议题、PR。

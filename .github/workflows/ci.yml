name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  platform:
    name: Platform checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out platform
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Verify and check out anonymous fixed app revisions
        run: node .github/scripts/check-app-sources.mjs --populate
      - name: Install locked platform dependencies
        run: npm ci
      - name: Check versions and synthetic platform tests
        run: npm test
